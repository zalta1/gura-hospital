services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gura
      POSTGRES_PASSWORD: gura
      POSTGRES_DB: gura
    ports:
      - "5432:5432"
    volumes:
      - gura_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gura -d gura"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gura:gura@db:5432/gura
      SECRET_KEY: INSECURE-LOCAL-DEV-KEY-CHANGE-ME
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./:/web
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_PROXY: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  gura_pg:
